openapi: 3.0.3
info:
  title: Social Network API
  version: 1.0.0
  description: API documentation for Social Network authentication and post retrieval.
servers:
  - url: https://api.socialnetwork.example.com/v1

paths:
  /auth/login:
    post:
      summary: User login
      description: Xác thực người dùng bằng email và mật khẩu. Không yêu cầu scope.
      tags:
        - Authentication
      security: [] # Public endpoint
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Đăng nhập thành công, trả về Access Token và Refresh Token.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
        '400':
          description: Bad Request - Thiếu email hoặc mật khẩu hoặc sai định dạng.
        '401':
          description: Unauthorized - Sai email hoặc mật khẩu.
        '429':
          description: Too Many Requests - Vượt quá số lần thử đăng nhập (Rate limit).
        '500':
          description: Internal Server Error.

  /auth/refresh:
    post:
      summary: Refresh access token
      description: Cấp lại Access Token mới dựa trên Refresh Token. Không yêu cầu scope cụ thể.
      tags:
        - Authentication
      security: [] # Thường gửi qua HttpOnly Cookie hoặc body, không dùng Bearer token chuẩn
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - refreshToken
              properties:
                refreshToken:
                  type: string
      responses:
        '200':
          description: Cấp lại token thành công.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
        '400':
          description: Bad Request - Thiếu Refresh Token trong yêu cầu.
        '401':
          description: Unauthorized - Refresh Token không hợp lệ, đã hết hạn, hoặc bị thu hồi.
        '500':
          description: Internal Server Error.

  /posts/{id}:
    get:
      summary: Lấy thông tin một bài viết
      description: Trả về chi tiết bài viết dựa trên ID. Yêu cầu scope `read:posts`.
      tags:
        - Posts
      security:
        - bearerAuth:
            - read:posts
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
          description: ID của bài viết
      responses:
        '200':
          description: Thành công. Trả về thông tin bài viết.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Post'
        '401':
          description: Unauthorized - Thiếu Access Token hoặc Token không hợp lệ.
        '403':
          description: Forbidden - Token hợp lệ nhưng thiếu scope `read:posts` hoặc người dùng không có quyền xem bài viết này (bài viết riêng tư).
        '404':
          description: Not Found - Không tìm thấy bài viết với ID tương ứng.
        '500':
          description: Internal Server Error.

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Truyền JWT Access Token vào header `Authorization: Bearer <token>`.

  schemas:
    LoginRequest:
      type: object
      required:
        - email
        - password
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          format: password
          
    TokenResponse:
      type: object
      properties:
        accessToken:
          type: string
        refreshToken:
          type: string
        expiresIn:
          type: integer
          description: Thời gian sống của access token (giây)

    Post:
      type: object
      properties:
        id:
          type: string
          format: uuid
        content:
          type: string
        authorId:
          type: string
          format: uuid
        createdAt:
          type: string
          format: date-time